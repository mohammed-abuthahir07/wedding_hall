  <rect x="23" y="39" width="18" height="3" rx="1" fill="#FFFFFF"/>
  <rect x="24" y="42" width="3" height="8" rx="1" fill="#FFFFFF"/>
  <rect x="37" y="42" width="3" height="8" rx="1" fill="#FFFFFF"/>
